<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드림차키 무료견적</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#0f172a}.wrap{max-width:620px;margin:auto;padding:20px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #0f172a12}h1{margin:0 0 8px;font-size:28px}.sub{color:#64748b;line-height:1.5;margin-bottom:20px}label{display:block;font-weight:800;margin:14px 0 6px}input,textarea{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{margin:0;font-weight:700}.chips input{display:none}.chips span{display:block;padding:10px 13px;border:1px solid #cbd5e1;border-radius:999px}.chips input:checked+span{background:#2563eb;color:#fff;border-color:#2563eb}button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:#f59e0b;color:#fff;font-size:18px;font-weight:900}.note{margin-top:13px;color:#64748b;font-size:13px;line-height:1.5}.status{margin-top:14px;font-weight:800}.ok{color:#059669}.err{color:#dc2626}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="card"><h1>🔑 드림차키 무료견적</h1><div class="sub">차량 정보를 남겨주시면 확인 후 연락드리겠습니다.</div>
<form id="qf"><label>연락처 *</label><input id="phone" inputmode="tel" required placeholder="010-0000-0000"><label>지역 *</label><input id="region" required placeholder="예: 인천 서구 청라동"><label>현재 상황</label><div class="chips"><label><input type="radio" name="state" value="스마트키 있음"><span>스마트키 있음</span></label><label><input type="radio" name="state" value="스마트키 없음"><span>스마트키 없음</span></label><label><input type="radio" name="state" value="스마트키 일부있음"><span>일부있음</span></label><label><input type="radio" name="state" value="도어개문"><span>도어개문</span></label></div><div class="grid"><div><label>차종 *</label><input id="car" required placeholder="예: 쏘렌토"></div><div><label>연식</label><input id="year" inputmode="numeric" placeholder="예: 2022"></div></div><label>요청 내용</label><textarea id="memo" rows="4" placeholder="예: 스마트키 추가 1개 견적"></textarea><button type="submit">무료견적 요청하기</button><div class="note">입력하신 정보는 견적 상담 목적으로만 사용됩니다.</div><div id="st" class="status"></div></form></div></div>
<script>
const params=new URLSearchParams(location.search),endpoint=params.get('endpoint')||'',f=document.getElementById('qf'),st=document.getElementById('st');
f.onsubmit=async e=>{e.preventDefault();if(!endpoint){st.className='status err';st.textContent='무료견적 전송 설정이 아직 완료되지 않았습니다.';return}const state=document.querySelector('input[name=state]:checked')?.value||'';const data={type:'blog_quote',source:'naver_blog',phone:document.getElementById('phone').value.trim(),region:document.getElementById('region').value.trim(),state,car:document.getElementById('car').value.trim(),year:document.getElementById('year').value.trim(),memo:document.getElementById('memo').value.trim(),sentAt:new Date().toISOString()};try{st.className='status';st.textContent='전송 중...';const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});if(!r.ok)throw new Error();st.className='status ok';st.textContent='견적 요청이 접수되었습니다. 확인 후 연락드리겠습니다.';f.reset()}catch{st.className='status err';st.textContent='전송하지 못했습니다. 잠시 후 다시 시도해 주세요.'}};
</script></body></html>
